name: Check Publication Integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test sync completeness and integrity safeguards
        run: python3 -m unittest discover -s tests/publication -p 'test_*.py'
      - name: Verify actual publication tree
        run: python3 .github/scripts/sync_namespace.py --target . --verify-only
